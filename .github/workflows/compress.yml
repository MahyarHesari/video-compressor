
name: Real Video Compression Test

on:
  workflow_dispatch:

jobs:
  compress:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Build FFmpeg image
        run: docker build -t video-compressor .

      - name: Download video
        env:
          VIDEO_URL: https://s6.uupload.ir/filelink/mjb6xmABe60g_6820edc4a2/s01-part01-intro_6kb9j.mp4
        run: |
          mkdir -p "$RUNNER_TEMP/video"
          curl -L --fail --show-error \
            "$VIDEO_URL" \
            -o "$RUNNER_TEMP/video/input.mp4"

      - name: Compress to 360p
        run: |
          docker run --rm \
            -v "$RUNNER_TEMP/video:/data" \
            video-compressor \
            -i /data/input.mp4 \
            -vf scale=-2:360 \
            -c:v libx264 \
            -preset veryfast \
            -crf 28 \
            -c:a aac \
            -b:a 96k \
            -movflags +faststart \
            /data/output.mp4

      - name: Check result
        run: |
          echo "Input size:"
          stat -c%s "$RUNNER_TEMP/video/input.mp4"

          echo "Output size:"
          stat -c%s "$RUNNER_TEMP/video/output.mp4"

          docker run --rm \
            -v "$RUNNER_TEMP/video:/data" \
            --entrypoint ffprobe \
            video-compressor \
            -v error \
            -show_entries format=duration,size \
            -show_entries stream=width,height,codec_name \
            -of default=noprint_wrappers=1 \
            /data/output.mp4

      - name: Save compressed video
        uses: actions/upload-artifact@v4
        with:
          name: compressed-video
          path: ${{ runner.temp }}/video/output.mp4
          retention-days: 1
